<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="45%" stop-color="#3FA636" />
      <stop offset="100%" stop-color="#0F472A" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA636" />
      <stop offset="100%" stop-color="#0B3C1D" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#3FA636" />
    </linearGradient>
  </defs>

  <!-- Background container for high contrast favicon -->
  <rect width="200" height="200" rx="44" fill="#FFFFFF" />

  <!-- Speed lines on left -->
  <line x1="18" y1="80" x2="44" y2="80" stroke="url(#speedGrad)" stroke-width="7" stroke-linecap="round" />
  <line x1="10" y1="100" x2="50" y2="100" stroke="url(#speedGrad)" stroke-width="7" stroke-linecap="round" />
  <line x1="20" y1="120" x2="46" y2="120" stroke="url(#speedGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Stylized N left pillar -->
  <path
    d="M 68 62 C 60 62 54 68 54 78 L 54 122 C 54 132 60 138 68 138 C 76 138 82 132 82 122 L 82 78 C 82 68 76 62 68 62 Z"
    fill="url(#nGrad)"
  />

  <!-- Diagonal fold of N -->
  <path
    d="M 64 68 C 64 64 74 62 82 72 L 126 128 C 132 136 142 134 142 124 L 142 82 C 142 74 136 68 128 68 C 120 68 116 74 116 80 L 116 92 L 84 56 C 76 46 64 52 64 68 Z"
    fill="url(#nGrad)"
  />

  <!-- Shopping cart frame -->
  <path
    d="M 124 92 L 138 92 L 152 122 L 178 122 C 182 122 186 118 188 114 L 194 92 C 196 86 191 80 185 80 L 134 80"
    stroke="url(#cartGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Cart wheels -->
  <circle cx="152" cy="138" r="8.5" fill="#0F472A" />
  <circle cx="152" cy="138" r="3" fill="#3FA636" />
  <circle cx="178" cy="138" r="8.5" fill="#0F472A" />
  <circle cx="178" cy="138" r="3" fill="#3FA636" />

  <!-- Fresh Green Leaf sprouting from shopping basket -->
  <path
    d="M 154 94 C 150 70 170 52 192 48 C 194 70 176 94 154 94 Z"
    fill="url(#leafGrad)"
  />
  <path
    d="M 158 92 Q 174 72 188 52"
    stroke="#0F472A"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
